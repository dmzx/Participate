imports:
  - { resource: 'tables.yml' }

services:
  dmzx.participate.settings:
    class: 'dmzx\participate\core\settings'
    arguments:
      - '@config'
      - '@config_text'

  dmzx.participate.listener:
    class: 'dmzx\participate\event\listener'
    arguments:
      - '@dbal.conn'
      - '@dmzx.participate.settings'
      - '@controller.helper'
      - '@request'
      - '@template'
      - '@user'
      - '@auth'
      - '@ext.manager'
      - '@language'
      - '%dmzx.participate.tables.participate%'
    tags:
      - { name: 'event.listener' }

  dmzx.participate.controller.acp:
    class: 'dmzx\participate\controller\acp_controller'
    arguments:
      - '@config'
      - '@language'
      - '@log'
      - '@request'
      - '@template'
      - '@user'
      - '@config_text'
      - '@dbal.conn'
      - '@ext.manager'
      - '%dmzx.participate.tables.participate%'

  dmzx.participate.controller:
    class: 'dmzx\participate\controller\controller'
    arguments:
      - '@dbal.conn'
      - '@user'
      - '@auth'
      - '@request'
      - '@language'
      - '@dmzx.participate.settings'
      - '%core.root_path%'
      - '%core.php_ext%'
      - '%dmzx.participate.tables.participate%'
